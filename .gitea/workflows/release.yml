# Release: when a tag like v1.2.3 is pushed, build the image for the server
# (linux/amd64), push it as 1.2.3 and latest, and create the Gitea release
# with the image digest and the commits since the previous tag.
#
# Needs a repo secret REGISTRY_TOKEN: a Gitea access token with
# write:package. GITEA_TOKEN is made by Gitea for each run.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the Gitea release

env:
  IMAGE: git.danieldaum.net/daniel/showcase

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the previous tag, for the notes

      - name: Build and push the image
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login "${IMAGE%%/*}" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker build --platform linux/amd64 -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"
          pushed=$(docker push "$IMAGE:${GITHUB_REF_NAME#v}")
          echo "$pushed"
          echo "DIGEST=$(echo "$pushed" | awk '/digest: sha256:/ {print $3}')" >> "$GITHUB_ENV"
          docker logout "${IMAGE%%/*}"

      - name: Create the Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          notes=$(git log --format='- %s' "${prev:+$prev..}$GITHUB_REF_NAME")
          jq -n --arg tag "$GITHUB_REF_NAME" --arg body "$(printf 'Image: `%s@%s`\n\n%s' "$IMAGE" "$DIGEST" "$notes")" \
            '{tag_name: $tag, name: $tag, body: $body}' |
            curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              --data @- "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
