# Example deployment. Pangolin proxies daum.dev to 127.0.0.1:8080, and the
# container reaches Gitea over the host's Tailscale connection.
services:
    daumdev:
        image: daumdev:latest
        build: .
        read_only: true
        cap_drop: [ALL]
        security_opt: ["no-new-privileges:true"]
        volumes:
            - daumdev-data:/data
            - ./config.json:/config.json:ro
        ports: ["127.0.0.1:8080:8080"]
        restart: unless-stopped
volumes:
    daumdev-data:
