{{define "crumbs" -}}
<nav class="crumbs" aria-label="path">
  {{- $dir := .Dir}}
  {{- range $i, $c := .C}}{{if $i}}<span class="crumb-sep" aria-hidden="true">/</span>{{end}}{{if .Href}}<a href="{{.Href}}">{{.Name}}</a>{{else}}<span aria-current="page">{{if $dir}}{{ficon "" "tree-open"}}{{end}}{{.Name}}</span>{{end}}{{end -}}
</nav>
{{- end}}
