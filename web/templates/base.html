{{define "base" -}}
<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{- with .GoImport}}
<meta name="go-import" content="{{.}}">
{{- end}}
<link rel="preload" href="/static/fonts/geistpixel/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css?v={{.CSS}}">
<script src="/static/copy.js?v={{.CSS}}" defer></script>
</head>
<body{{if .Wide}} class="page--code"{{end}}>
<a class="skip-link" href="#site-main">skip to content</a>
{{template "sprite"}}
<header class="site-header">
  <a class="site-name" href="/">daum.dev</a>
  <nav aria-label="site">
    <a href="/">repos</a>
    {{- range .Links}}{{if eq .Name "website"}}
    <a href="{{.URL}}">website</a>
    {{- end}}{{end}}
  </nav>
</header>
<main id="site-main">
{{template "content" .D}}
</main>
<footer>
  <nav aria-label="site links">
    <p aria-hidden="true">//</p>
    {{- range .Links}}
    <a href="{{.URL}}" rel="me">{{.Name}}</a>
    {{- end}}
  </nav>
</footer>
</body>
</html>
{{end}}
