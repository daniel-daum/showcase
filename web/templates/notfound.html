{{define "content" -}}
<section class="notfound">
  <h1>404</h1>
  <p>this page doesn't exist</p>
  {{- with .}}{{with .Featured}}
  <ul class="nf-repos" aria-label="repositories">
    {{- range .}}<li><a class="chip" href="/{{.Name}}/">{{template "icon" "book"}}{{.Name}}</a></li>{{end}}
  </ul>
  {{- end}}{{end}}
  <p class="nf-links"><a class="button button--primary" href="/">Back home</a><a class="button" href="/repos/">All repositories</a></p>
</section>
{{- end}}
