{{define "content" -}}
<header class="page-header page-header--post">
  <p class="page-header-kicker">
    <a href="/"><span aria-hidden="true">/</span>projects</a>
  </p>
  <h1>Repositories</h1>
  <p class="meta">All {{len .Repos}} public repositories, most recently updated first</p>
</header>
<div class="repo-grid">
  {{- range .Repos}}
  {{template "repocard" .}}
  {{- end}}
</div>
{{- end}}
